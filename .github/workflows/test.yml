name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python UTF-8 diagnostics
        run: python -c "import locale, sys; print(sys.stdout.encoding); print(sys.stderr.encoding); print(locale.getpreferredencoding(False))"
      - name: Validate Skill runtime
        run: python scripts/validate_skill.py --runtime
      - name: Repository convergence check
        run: python scripts/validate_skill.py --convergence-only
      - name: Unit tests
        run: python -B scripts/run_tests.py --suite unit
      - name: Integration tests
        run: python -B scripts/run_tests.py --suite integration
      - name: Contract eval
        run: python -B scripts/run_tests.py --suite contract
      - name: Validate model eval definitions
        run: python scripts/run_model_evals.py validate
