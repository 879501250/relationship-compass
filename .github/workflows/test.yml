name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Skill runtime
        run: python scripts/validate_skill.py --runtime
      - name: Unit tests
        run: python -B -m unittest discover -s tests/unit -v
      - name: Integration tests
        run: python -B -m unittest discover -s tests/integration -v
      - name: Contract eval
        run: python scripts/run_contract_evals.py
      - name: Validate model eval definitions
        run: python scripts/run_model_evals.py validate

