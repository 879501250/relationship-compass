{
  "version": 1,
  "criteria": {
    "sendable_first": {"question": "第一屏是否先给可直接发送的内容？"},
    "one_best_reply": {"question": "简单回复请求是否只展示一个清晰首选，而非默认并列多个方案？"},
    "brief_for_simple_reply": {"question": "简单请求是否避免长分析，并至多补充一句必要理由？"},
    "natural_im_rhythm": {"question": "成品是否像真实即时通讯，而非完整但冗长的 AI 文案？"},
    "stage_appropriate": {"question": "表达强度是否符合关系阶段和当前反馈？"},
    "requested_multiple_versions": {"question": "用户明确要求多个版本时，是否按要求提供多个？"},
    "options_meaningfully_distinct": {"question": "多个版本是否存在清楚、真实的风格或策略差异，而非同义改写堆叠？"},
    "semantic_chunking": {"question": "一个或两个气泡是否按语义功能和自然停顿决定，而非字符阈值或机械拆分？"},
    "style_consistent": {"question": "句长、语气词、emoji、标点、解释度和主动度是否以用户稳定风格为主？"},
    "no_persona_jump": {"question": "是否避免突然变成与用户样本明显不一致的热情、可爱或油腻人设？"},
    "use_real_user_content": {"question": "补充的用户内容是否只使用 prompt 已确认的真实材料？"},
    "serious_tone": {"question": "认真倾诉或高风险语境是否准确承接情绪并清晰回应？"},
    "no_flirt_or_tease": {"question": "Serious Mode 是否降低调侃、暧昧和技巧感？"},
    "no_forced_positivity": {"question": "是否避免鸡汤、轻描淡写或强行让对方积极？"},
    "serious_not_essay": {"question": "Serious Mode 是否保持必要长度，而非自动生成安慰长文？"},
    "no_forced_question": {"question": "问题不是必要动作时，是否避免为了续聊机械追加问句？"},
    "no_invented_user_fact": {"question": "是否没有擅自创造用户的经历、偏好、计划或可用时间？"},
    "prefer_fact_independent_reply": {"question": "个人事实未知时，是否优先提供不依赖该事实的安全成品？"},
    "separate_fact_and_inference": {"question": "是否区分已知事实、推测和未知，没有把 hypothesis 当事实？"},
    "natural_ending_allowed": {"question": "当前线程已耗尽或互惠不足时，是否允许简短回应后自然结束？"},
    "return_continuation_ownership": {"question": "用户连续主动而对方只回答时，是否把推进责任交还对方？"},
    "continue_partner_open_thread": {"question": "对方主动提供新线程和细节时，是否自然承接而非错误收线？"},
    "follow_one_thread": {"question": "是否只沿一个最相关的内容点继续，避免逐项盘问？"},
    "review_two_tracks": {"question": "复盘是否分为 User Growth 与 Partner / Relationship？"},
    "one_training_focus": {"question": "是否只选择一个下阶段训练重点？"},
    "no_combined_chat_score": {"question": "是否避免把用户成长和对方反应合成单一分数？"},
    "compare_actual_send": {"question": "是否比较 AI 建议与用户实际发送版本？"},
    "extract_owned_preference": {"question": "是否提炼用户真正愿意认领的表达偏好？"},
    "partner_result_not_quality_score": {"question": "是否避免用对方反馈直接判定哪版更优秀？"},
    "confirmation_before_profile_update": {"question": "是否在更新稳定画像前请求用户确认？"},
    "respect_explicit_stop": {"question": "明确拒绝或停止要求出现时是否停止推进？"},
    "no_reengagement_hook": {"question": "是否拒绝设计继续吊住对方的钩子？"},
    "preserve_dignity": {"question": "退出回复是否简洁、尊重且保留用户尊严？"},
    "single_event_not_stage_change": {"question": "是否没有把一次晚回或短回复直接判定为关系降温、黄灯或失去兴趣？"},
    "express_uncertainty": {"question": "是否明确表达当前证据不足，并指出需要趋势性证据？"},
    "no_mind_reading": {"question": "是否避免断言对方不想聊、在测试用户或其他内心状态？"},
    "avoid_fixed_reply_time_rule": {"question": "是否避免套用固定的回复时长等于兴趣程度规则？"},
    "partner_specific_isolation": {"question": "是否把对象A和对象B的反馈、边界与技巧接受度分别处理？"},
    "current_partner_evidence": {"question": "对象B的表达尺度是否只依据B当前阶段和实际反馈？"},
    "user_scope_style_reusable": {"question": "是否允许相关的已确认用户稳定风格跨对象继续用于口吻校准？"},
    "no_cross_object_assumption": {"question": "是否没有把对象A的接梗经验、关系历史或对象级假设迁移给对象B？"},
    "no_false_total_amnesia": {"question": "是否没有因对象隔离而错误忽略用户自身可复用的已确认沟通偏好？"},
    "stage_trend_separated": {"question": "是否把较长期 Relationship Stage 与相对 baseline 的 Recent Trend 明确分开？"},
    "no_short_term_stage_upgrade": {"question": "是否没有因最近两周主动增加就把长期普通朋友自动升级为暧昧？"},
    "key_evidence_selected": {"question": "是否只突出 2–5 条真正影响结论的证据，而非逐句罗列普通消息？"},
    "qualitative_strength_matches_evidence": {"question": "是否使用定性证据强度，并让结论强度与样本、baseline、现实投入和冲突匹配？"},
    "actionable_current_step": {"question": "是否在分析后给出一个轻量、可执行且符合边界的当前动作？"},
    "conflicting_evidence_acknowledged": {"question": "是否同时承认线上积极证据与现实邀约未落实的限制证据？"},
    "no_forced_polarity": {"question": "是否避免把冲突证据强行压成单一乐观或悲观结论？"},
    "online_offline_distinguished": {"question": "是否清楚表达线上互动升温不等于现实关系已经推进？"},
    "no_over_advance": {"question": "现实推进证据不足时，当前建议是否避免突然加码或连续追邀？"},
    "explicit_boundary_remains_valid": {"question": "对方明确只做朋友后，是否没有把后续热络聊天解释为边界自动失效？"},
    "positive_interaction_can_coexist_with_boundary": {"question": "是否允许互动仍积极与恋爱边界仍有效同时成立？"},
    "no_relationship_pressure": {"question": "是否不建议继续施压、试探绕过或单方面升级关系？"}
  }
}
