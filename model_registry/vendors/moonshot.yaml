{
  "id": "moonshot",
  "name": "Moonshot AI",
  "website": "https://platform.moonshot.cn",
  "description": "Moonshot 官方兼容 OpenAI Chat Completions 的 API",
  "category": "official",
  "protocol": "openai_compatible_chat",
  "parameter_mapping": {"max_output_tokens": "max_completion_tokens"},
  "transport_defaults": {"max_retries": 2},
  "base_urls": [
    {
      "id": "official-cn",
      "url": "https://api.moonshot.cn/v1",
      "model_families": ["kimi"],
      "default_for": ["kimi"]
    },
    {
      "id": "official-global",
      "url": "https://api.moonshot.ai/v1",
      "model_families": ["kimi"]
    }
  ]
}
